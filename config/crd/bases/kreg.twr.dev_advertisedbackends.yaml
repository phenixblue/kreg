---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: advertisedbackends.kreg.twr.dev
spec:
  group: kreg.twr.dev
  names:
    kind: AdvertisedBackend
    listKind: AdvertisedBackendList
    plural: advertisedbackends
    singular: advertisedbackend
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.prefix
      name: Prefix
      type: string
    - jsonPath: .status.clusterID
      name: Cluster
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AdvertisedBackend is the Schema for the advertisedbackends API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AdvertisedBackend
            type: object
          status:
            description: status defines the observed state of AdvertisedBackend
            properties:
              attributes:
                description: |-
                  BackendAttributes are the semantic attributes decoded from a route's
                  BGP large communities (or their fallbacks), mirroring
                  pipeline.BackendCandidate. MED and ASPath are int64, not uint32: 4-byte
                  ASNs and this design's own worked example (asPath: [4200000101])
                  already exceed int32's range, the only signed format OpenAPI schemas
                  natively support below it — same reasoning as BGPPeerConfig's ASN
                  fields.
                properties:
                  asPath:
                    items:
                      format: int64
                      type: integer
                    type: array
                  drain:
                    type: boolean
                  largeCommunities:
                    items:
                      type: string
                    type: array
                  med:
                    format: int64
                    type: integer
                  serviceTag:
                    format: int32
                    type: integer
                  tier:
                    type: string
                  weight:
                    format: int32
                    type: integer
                type: object
              boundPolicies:
                description: |-
                  boundPolicies are the BGPBackendPolicies (as "namespace/name") whose
                  selector currently matches this backend.
                items:
                  type: string
                type: array
              clusterID:
                type: string
              dampeningPenalty:
                format: int32
                type: integer
              firstSeen:
                format: date-time
                type: string
              flapCount24h:
                description: |-
                  flapCount24h and dampeningPenalty are populated once the Damper
                  exists (build-order step 4); always zero until then.
                format: int32
                type: integer
              generatedResources:
                description: |-
                  generatedResources lists what the Reconcile stage produced for this
                  backend, as "Kind/namespace/name".
                items:
                  type: string
                type: array
              lastChange:
                format: date-time
                type: string
              locality:
                description: Locality describes where a cluster in a ClusterBinding
                  lives.
                properties:
                  region:
                    type: string
                  zone:
                    type: string
                required:
                - region
                - zone
                type: object
              peer:
                description: peer is the BGP peer address this route was learned from.
                type: string
              prefix:
                type: string
              reason:
                description: |-
                  reason explains a non-Active state, e.g. "prefix 203.0.113.5/32 not
                  in allowedPrefixes for any cluster".
                type: string
              state:
                description: |-
                  BackendState mirrors where a route currently sits in the pipeline.
                  Only Active, Draining, and Rejected are reachable before the Damper
                  exists (build-order step 4) — HoldDown and Dampened are schema-valid
                  but nothing sets them yet.
                enum:
                - Active
                - HoldDown
                - Draining
                - Dampened
                - Rejected
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
