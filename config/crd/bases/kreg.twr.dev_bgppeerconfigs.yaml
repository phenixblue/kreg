  names:
    kind: BGPPeerConfig
    listKind: BGPPeerConfigList
    plural: bgppeerconfigs
    singular: bgppeerconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BGPPeerConfig is the Schema for the bgppeerconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of BGPPeerConfig
            properties:
              clusterBindings:
                description: |-
                  clusterBindings is the trust boundary: a peer may only originate
                  prefixes bound to it here. Enforced in-controller, independent of
                  any router-side prefix-list — the origin cluster is identified by
                  which binding's allowedPrefixes contains the route, never by which
                  peer advertised it (through a route reflector, the advertising peer
                  is always the RR).
                items:
                  description: |-
                    ClusterBinding binds a range of prefixes to the cluster authorized to
                    originate them, and the locality that cluster lives in. This is the
                    security boundary the Authorize pipeline stage enforces.
                  properties:
                    allowedPrefixes:
                      description: |-
                        allowedPrefixes are the only prefixes this cluster may originate.
                        Routes outside every binding's allowedPrefixes are dropped, not
                        attributed to any cluster.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    clusterID:
                      type: string
                    locality:
                      description: Locality describes where a cluster in a ClusterBinding
                        lives.
                      properties:
                        region:
                          type: string
                        zone:
                          type: string
                      required:
                      - region
                      - zone
                      type: object
                    maxPrefixes:
                      description: |-
                        maxPrefixes caps how many prefixes this cluster may have accepted at
                        once. It's a per-cluster budget, not a per-session one: through a
                        route reflector, one physical peer session can carry multiple
                        clusters' routes, distinguished only by which binding matched.
                        Exceeding it fails closed on this cluster's excess routes only
                        (flagged Rejected, same as an allowedPrefixes miss) — it does not
                        tear down the shared session or affect any other cluster behind the
                        same peer.
                      format: int32
                      minimum: 0
                      type: integer
                  required:
                  - allowedPrefixes
                  - clusterID
                  - locality
                  type: object
                type: array
              listenPort:
                default: 179
                description: listenPort is the port the controller listens for BGP
                  sessions on.
                format: int32
                type: integer
              localASN:
                description: |-
                  localASN is the controller's own ASN. Use the 4-byte private range
                  (4200000000-4294967294); the 2-byte private range is too small.
                  int64 because 4-byte ASNs overflow int32, the only signed integer
                  format OpenAPI schemas natively support below it.
                format: int64
                maximum: 4294967295
                minimum: 0
                type: integer
              mode:
                default: RouteReflectorClient
                description: mode selects how the controller acquires routing state.
                enum:
                - RouteReflectorClient
                - Passive
                - BMPCollector
                type: string
              peers:
                description: |-
                  peers are the BGP sessions the controller establishes. name must be
                  unique — it's the key used to resolve which peer a
                  tcpMD5SecretRef-resolved password belongs to.
                items:
                  description: BGPPeer is one BGP session the controller establishes.
                  properties:
                    address:
                      type: string
                    auth:
                      description: BGPPeerAuth configures authentication for a BGP
                        session.
                      properties:
                        tcpMD5SecretRef:
                          description: |-
                            tcpMD5SecretRef points at the key within a Secret, in the same
                            namespace, holding the TCP MD5 password.
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                    gracefulRestart:
                      description: GracefulRestartConfig configures BGP graceful restart
                        for a session.
                      properties:
                        enabled:
                          type: boolean
                        staleRoutesTime:
                          description: |-
                            staleRoutesTime bounds how long routes are held after a restart
                            before being treated as withdrawn.
                          type: string
                      type: object
                    name:
                      type: string
                    remoteASN:
                      description: remoteASN is the peer's ASN.
                      format: int64
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                    timers:
                      description: BGPTimers configures BGP session timers.
                      properties:
                        hold:
                          type: string
                        keepalive:
                          type: string
                      type: object
                  required:
                  - address
                  - name
                  - remoteASN
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              routerID:
                description: routerID is the controller's BGP router ID.
                type: string
            required:
            - localASN
            - routerID
            type: object
          status:
            description: status defines the observed state of BGPPeerConfig
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the BGPPeerConfig
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              peers:
                items:
                  description: PeerStatus is the observed state of one BGP session.
                  properties:
                    name:
                      type: string
                    prefixesAccepted:
                      format: int32
                      type: integer
                    prefixesReceived:
                      format: int32
                      type: integer
                    prefixesRejected:
                      description: |-
                        prefixesRejected is the count of routes dropped by Authorize; see
                        AdvertisedBackend for per-route reasons.
                      format: int32
                      type: integer
                    sessionState:
                      description: PeerSessionState mirrors the BGP FSM, simplified
                        to what operators need.
                      enum:
                      - Idle
                      - Connect
                      - Active
                      - OpenSent
                      - OpenConfirm
                      - Established
                      type: string
                    uptime:
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
