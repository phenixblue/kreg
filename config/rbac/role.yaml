---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - kreg.twr.dev
  resources:
  - bgpbackendpolicies
  - bgppeerconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kreg.twr.dev
  resources:
  - bgpbackendpolicies/finalizers
  - bgppeerconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - kreg.twr.dev
  resources:
  - bgpbackendpolicies/status
  - bgppeerconfigs/status
  verbs:
  - get
  - patch
  - update
